  # ---------------- YAPAY ZEKÂ ----------------
  - id: YZ-01
    baslik: "Yapay zekâ kullanımı açıkça belirtilmiş mi?"
    kategori: yapay_zeka
    siddet: DUZELT
    kosul: >
      Reklamda, tüketicinin satın alma kararını önemli ölçüde etkileyecek şekilde yapay zekâ veya başka bir yazılım
      kullanıldıysa (ör. ürün görseli, ürünün sonucunu gösteren önce/sonra, ürünü kullanan kişi, ses) bu açık,
      anlaşılır ve ayırt edilebilir şekilde belirtilmelidir.
    duzeltme: >
      Açıklamaya ve ekrana (görselin üstüne) kısa bir beyan koyun: "Bu reklamdaki [ürün görselleri / kişi / ses]
      yapay zekâ ile oluşturulmuştur."
    ornek_metin: "Bu reklamdaki {yz_neler} yapay zekâ ile oluşturulmuştur."
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "18(8)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
    belirsizlik: >
      Yönetmelik hazır bir beyan metni vermiyor ve "önemli ölçüde etkileyecek şekilde" ölçütünü tanımlamıyor. Kontrol,
      ürün, sonuç, kişi ya da ses yapay zekâ ile üretildiyse beyanı hem açıklamada hem ekranda ister (daha sıkı).
      Platformların otomatik "Yapay zekâ bilgisi" etiketinin yeterli olup olmadığı net değil.

  - id: YZ-02
    baslik: "İnsandan ayırt edilemeyen dijital karakter"
    kategori: yapay_zeka
    siddet: DUZELT
    kosul: "Reklamda yapay zekâ ile üretilmiş ve insandan ayırt edilemeyen bir dijital karakter varsa bu açıkça belirtilmelidir."
    duzeltme: "Karakter ekrandayken \"Bu karakter yapay zekâ ile oluşturulmuştur.\" yazısını gösterin; açıklamada da belirtin."
    ornek_metin: "Bu karakter yapay zekâ ile oluşturulmuştur."
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "18(8)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"

  - id: YZ-03
    baslik: "Gerçek bir kişinin yapay zekâ kopyası ürünü kullanmış/önermiş gibi mi?"
    kategori: yapay_zeka
    siddet: DUZELT
    kosul: >
      Gerçek bir kişinin yapay zekâ ile oluşturulmuş dijital kopyasının, gerçeğe aykırı biçimde ürünü bizzat
      deneyimlediği, kullandığı ya da tavsiye ettiği izlenimini veren reklam YAPILAMAZ. Beyan eklemek bunu düzeltmez.
    duzeltme: >
      Bu sahneyi çıkarın. Kişi ürünü gerçekten kullanıyor ve onay veriyorsa gerçek çekim ve yazılı izin kullanın;
      bu durumda da bir uzmana danışın.
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "27(12)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
      - belge: "Yönetmelik"
        madde: "5(1)(f), 11(1) (izinsiz kişi kullanımı, itibardan haksız yararlanma)"
        url: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
        okunma: "2026-10-27"

  - id: YZ-04
    baslik: "Yapay zekâ yalnızca yardımcı araç olarak mı kullanıldı?"
    kategori: yapay_zeka
    siddet: UYARI
    kosul: >
      Yapay zekâ yalnızca metin yazımı, altyazı, arka plan, renk düzeltme gibi ürünü ya da sonucu değiştirmeyen işlerde
      kullanıldıysa 18(8) kapsamına girip girmediği net değildir.
    duzeltme: >
      Görüntü ürünü ya da sonucu olduğundan farklı göstermiyorsa beyan zorunlu olmayabilir. Emin değilseniz kısa bir
      beyan ekleyin: "Görsellerde yapay zekâ ile düzenleme yapılmıştır."
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "18(8)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
    belirsizlik: "Kapsamın sınırı Yönetmelik'te tanımlı değil."

  # ---------------- İNDİRİM / FİYAT ----------------
  - id: FYT-01
    baslik: "İndirimli satış reklamında zorunlu bilgiler"
    kategori: indirim
    siddet: DUZELT
    kosul: >
      İndirim gösteren herhangi bir yazılı, sesli ya da görsel ibare varsa reklamda indirimden önceki fiyat, indirimin
      başlangıç ve bitiş tarihleri ve miktar sınırlıysa bu miktar açık ve anlaşılır şekilde yer almalıdır.
    duzeltme: >
      Açıklamaya ve ekrana şunu ekleyin: "İndirimden önceki fiyat: X TL · İndirimli fiyat: Y TL · Kampanya: GG.AA–GG.AA.YYYY
      · Stok: N adet ile sınırlı (varsa)".
    kaynak:
      - belge: "Yönetmelik (RG 31737 ile değişik)"
        madde: "14(1)"
        url: https://www.resmigazete.gov.tr/eskiler/2022/02/20220201-6.htm
        okunma: "2026-10-27"

  - id: FYT-02
    baslik: "İndirimden önceki fiyat = son 10 günün en düşük fiyatı mı?"
    kategori: indirim
    siddet: DUZELT
    kosul: >
      Mal satışında indirimden önceki fiyat, indirimin başlangıç tarihinden önceki 10 gün içinde uygulanan EN DÜŞÜK
      fiyattır. Meyve-sebze gibi çabuk bozulan mallarda ve hizmetlerde indirimli fiyattan bir önceki fiyat esas alınır.
      01.08.2026'dan önce başlayan indirimlerde bu süre 30 gündü. İspat yükü reklam verendedir.
    duzeltme: >
      Üstü çizili fiyatı, son 10 günün en düşük fiyatıyla değiştirin ve indirim oranını bu fiyata göre yeniden
      hesaplayın. Fiyat geçmişinin kaydını (ekran görüntüsü, sipariş kaydı) saklayın.
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile değişik)"
        madde: "14(3)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
      - belge: "Yönetmelik (RG 31737 ile değişik, 01.08.2026 öncesi hali: 30 gün; ispat külfeti)"
        madde: "14(3)"
        url: https://www.resmigazete.gov.tr/eskiler/2022/02/20220201-6.htm
        okunma: "2026-10-27"
    belirsizlik: >
      2026 metni ispat külfeti cümlesini yeniden yazmadı; 2022 metnindeki "ispat külfeti reklam verene aittir" cümlesinin
      yeni üçüncü fıkrada kalıp kalmadığı net değil. Genel kural olarak Yönetmelik 9(1) ve Kanun 61(6) iddiaların ispatını
      reklam verene yüklüyor.

  - id: FYT-03
    baslik: "Önceki fiyat aynı satış kanalından mı?"
    kategori: indirim
    siddet: DUZELT
    kosul: >
      Ürün farklı kanallarda satılıyorsa (web sitesi, pazaryeri, mağaza, Instagram) indirimden önceki fiyat yalnız
      indirimin yapıldığı kanaldaki fiyattır. Bir kanaldaki fiyat başka kanaldaki indirim için kullanılamaz.
    duzeltme: "Üstü çizili fiyatı, indirimin yapıldığı kanalın son 10 günlük en düşük fiyatından alın."
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "14(5)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"

  - id: FYT-04
    baslik: "İndirim oranı abartılı mı?"
    kategori: indirim
    siddet: DUZELT
    kosul: >
      Gerçekte olduğundan daha fazla indirim uygulanıyormuş izlenimi veren ifade veya görüntü olamaz. Metindeki en
      yüksek yüzde, doğru referans fiyata göre hesaplanan oranı aşıyorsa hata verilir.
    duzeltme: "Yüzdeyi doğru referans fiyata göre yeniden hesaplayın (aşağı yuvarlayın)."
    kaynak:
      - belge: "Yönetmelik"
        madde: "14(2)"
        url: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
        okunma: "2026-10-27"

  - id: FYT-05
    baslik: "Fiyat vergiler dahil ve TL olarak mı?"
    kategori: indirim
    siddet: DUZELT
    kosul: "Reklamdaki fiyat tüm vergiler dahil toplam satış fiyatı olmalı ve \"TL\", \"Türk Lirası\" ya da ₺ ile yazılmalıdır. \"+KDV\" tüketici reklamında olmaz."
    duzeltme: "Fiyatı KDV dahil toplam fiyat olarak yazın; \"+KDV\" ifadesini kaldırın."
    kaynak:
      - belge: "Yönetmelik"
        madde: "13(2), 13(4)"
        url: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
        okunma: "2026-10-27"

  - id: FYT-06
    baslik: "Süre ya da stok sınırı açıkça yazılmış mı?"
    kategori: indirim
    siddet: DUZELT
    kosul: "Fiyatın geçerliliğiyle ilgili süre veya stok sınırı varsa (\"stoklarla sınırlı\", \"son gün\") süre ve stok miktarı açıkça belirtilmelidir."
    duzeltme: "\"Stoklarla sınırlı\" yerine \"200 adet ile sınırlı\" gibi sayı ve bitiş tarihi yazın."
    kaynak:
      - belge: "Yönetmelik"
        madde: "13(9), 14(1)"
        url: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
        okunma: "2026-10-27"

  - id: FYT-07
    baslik: "Taksit varsa toplam fiyat ve taksit sayısı"
    kategori: indirim
    siddet: DUZELT
    kosul: "Taksit tutarı verilen reklamlarda toplam fiyat ve taksit sayısı, taksit tutarıyla birlikte okunur büyüklükte gösterilmelidir."
    duzeltme: "\"Ayda 250 TL\" yanına \"12 taksit, toplam 3.000 TL\" yazın."
    kaynak:
      - belge: "Yönetmelik"
        madde: "13(7)"
        url: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
        okunma: "2026-10-27"

  - id: FYT-08
    baslik: "Koşullu indirim (\"2 al 1 öde\", \"500 TL üzeri\")"
    kategori: indirim
    siddet: UYARI
    kosul: >
      İndirim belli miktarda alım ya da bir işlem şartına bağlıysa (koşullu satış) 14. madde kuralları (önceki fiyat,
      tarihler) yine uygulanır; fiyatın başka bir alıma bağlı olduğu şartlar açıkça yazılmalıdır.
    duzeltme: "Şartı (\"2 adet alımda\", \"sepet 500 TL ve üzeri\") ana mesajda yazın; önceki fiyat ve tarihleri de ekleyin."
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "14(7)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
      - belge: "Yönetmelik"
        madde: "13(6)"
        url: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
        okunma: "2026-10-27"

  # ---------------- SAĞLIK ve YASAKLI ÜRÜNLER ----------------
  - id: SAG-01
    baslik: "Sağlık beyanı kırmızı bayrakları"
    kategori: saglik
    siddet: UZMANA_SOR
    kosul: >
      Metinde hastalık, tedavi, zayıflama, bağışıklık, "mucize", "yan etkisiz", "klinik olarak kanıtlanmış" gibi ifadeler
      varsa: ilgili mevzuata aykırı sağlık beyanı yapılamaz; bilimsel iddialar ispatlanmalı ve çarpıtılmamalıdır.
      Sağlık beyanının hangi ürün için serbest olduğu sektör mevzuatına (gıda, kozmetik, tıbbi cihaz) bağlıdır; bu
      araç onu değerlendirmez.
    duzeltme: >
      Hastalık, tedavi ve kesin sonuç vaat eden ifadeleri çıkarın. Kalan iddialar için belge isteyin ve yayından önce
      bir uzmana ya da reklam verenin hukuk ekibine danışın.
    kaynak:
      - belge: "Kılavuz"
        madde: "6(1)(b), 6(1)(c)"
        url: https://iabtr.org/wp-content/uploads/2024/06/Sosyal-Medya-Etkileyicileri-Tarafindan-Yapilan-Ticari-Reklam-ve-Haksiz-Ticari-Uygulamalar-Hakkinda-Kilavuz1062021101250.pdf
        okunma: "2026-10-27"
      - belge: "Yönetmelik"
        madde: "5(1)(h), 7(5)(a), 7(8), 9(2)"
        url: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
        okunma: "2026-10-27"
    belirsizlik: >
      RG 33297 Yönetmeliğin 26. maddesini (özel mevzuata uyum) ve Ek'teki A-13 bendini (mevzuata aykırı sağlık beyanı
      aldatıcı uygulamadır) yürürlükten kaldırdı. Bu, sağlık beyanlarının serbest olduğu anlamına gelmez; sektör
      mevzuatı ve 7. madde (yanıltıcılık) geçerlidir. Kontrol bu yüzden UZMANA_SOR verir.

  - id: SAG-02
    baslik: "Hekim, eczacı ya da sağlık kuruluşu tanıtımı"
    kategori: saglik
    siddet: UZMANA_SOR
    kosul: >
      Etkileyiciler doktor, diş hekimi, veteriner hekim, eczacı ve sağlık kuruluşlarının sunduğu mal veya hizmetlere
      yönlendirme yapamaz, bunların tanıtımını yapamaz. Reklamlarda bu meslek mensuplarının sağlık beyanında bulunduğu
      izlenimi verilemez.
    duzeltme: "Klinik, hastane, hekim ya da eczane tanıtımı içeren etkileyici paylaşımlarını yayınlamadan önce uzmana danışın; çoğu durumda yapılmamalıdır."
    kaynak:
      - belge: "Kılavuz"
        madde: "6(1)(ç)"
        url: https://iabtr.org/wp-content/uploads/2024/06/Sosyal-Medya-Etkileyicileri-Tarafindan-Yapilan-Ticari-Reklam-ve-Haksiz-Ticari-Uygulamalar-Hakkinda-Kilavuz1062021101250.pdf
        okunma: "2026-10-27"
      - belge: "Yönetmelik"
        madde: "16(3)"
