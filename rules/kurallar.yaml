  # ---------------- ÇOCUKLAR ----------------
  - id: COC-01
    baslik: "Çocuklara yönelik ya da çocuk oynayan reklam"
    kategori: cocuk
    siddet: MANUEL
    kosul: >
      Çocuklara yönelik, çocukları etkileme olasılığı olan ya da çocukların oynadığı reklamlarda 24. maddedeki liste
      gözden geçirilmelidir (tehlikeli davranış, gerçek dışı beklenti, akran üstünlüğü, ebeveyni ikna etmeye teşvik,
      "her bütçeye uygun", fiyat yanında "yalnızca/sadece" vb.).
    duzeltme: >
      Fiyatın yanındaki "yalnızca/sadece" kelimelerini, "annene söyle, al(dır)" türü çağrıları ve "her aile bütçesine
      uygun" ifadesini çıkarın; çocuğun güvenliğini ve gerçekçi beklentiyi kontrol edin.
    kaynak:
      - belge: "Yönetmelik"
        madde: "24(1)(a)-(n), 5(1)(ç)"
        url: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
        okunma: "2026-10-27"
      - belge: "6502 sayılı Kanun"
        madde: "61(3)"
        url: https://mevzuat.gov.tr/mevzuatmetin/1.5.6502.pdf
        okunma: "2026-10-27"

  - id: COC-02
    baslik: "Çocuğa yönelik ifade ihlalleri (metinde bulunan)"
    kategori: cocuk
    siddet: DUZELT
    kosul: >
      Çocuklara yönelik reklamda fiyat yanında "yalnızca/sadece", "her bütçeye uygun", ebeveyni ikna etmeye doğrudan
      teşvik ya da doğrudan çocuğa satın alma daveti (mesafeli satış) bulunamaz.
    duzeltme: "Bulunan ifadeleri çıkarın."
    kaynak:
      - belge: "Yönetmelik"
        madde: "24(1)(ı), 24(1)(j), 24(1)(k), 24(2)"
        url: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
        okunma: "2026-10-27"

  - id: COC-03
    baslik: "Çocuklara kişisel veriyle hedefli reklam"
    kategori: cocuk
    siddet: DUZELT
    kosul: "Tüketicinin çocuk olduğu biliniyorsa ya da makul olarak bilinmesi bekleniyorsa kişisel verilere dayalı profilleme ile hedefli reklam yapılamaz."
    duzeltme: "Reklam hedeflemesinde 18 yaş altı kitleyi ve çocuklara yönelik ilgi alanı profillerini kullanmayın."
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "25/A(3)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
    belirsizlik: "25/A satıcı, sağlayıcı ve aracı hizmet sağlayıcılara hitap eder; etkileyicinin kendi hedeflemesine nasıl uygulanacağı net değil."

  - id: COC-04
    baslik: "Aşırı tüketimi önerilmeyen gıdalar ve çocuklar"
    kategori: cocuk
    siddet: UZMANA_SOR
    kosul: >
      Sağlık Bakanlığı listesinin kırmızı kategorisindeki gıda ve içecekler (ör. bazı tatlı ve yağlı atıştırmalıklar)
      münhasıran çocuklara yönelik mecralarda reklam edilemez; diğer mecralarda dengeli beslenme uyarısı gerekir.
    duzeltme: "Ürünün kırmızı kategoride olup olmadığını reklam verene sorun; öyleyse uyarı metnini ekleyin ve çocuk kitlesini hedeflemeyin."
    kaynak:
      - belge: "Yönetmelik"
        madde: "24/A"
        url: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
        okunma: "2026-10-27"

  # ---------------- KARŞILAŞTIRMALI REKLAM ----------------
  - id: KRS-01
    baslik: "Rakibin adı, markası ya da logosu geçiyor mu?"
    kategori: karsilastirma
    siddet: DUZELT
    kosul: "Karşılaştırmalı reklamlarda rakiplere ait ürün adı, marka, logo, ticaret unvanı veya diğer ayırt edici unsurlara yer verilemez."
    duzeltme: "Rakibin adını, logosunu ve tanınır ambalajını çıkarın (bulanıklaştırmak yeterli olmayabilir; ayırt edilemez hale getirin)."
    kaynak:
      - belge: "Yönetmelik (RG 28.12.2018/30639 ile eklenen)"
