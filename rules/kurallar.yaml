  # ---------------- ÇEVRE ----------------
  - id: CEV-01
    baslik: "Çevresel beyan (\"çevre dostu\", \"sürdürülebilir\", \"karbon nötr\")"
    kategori: cevre
    siddet: UYARI
    kosul: >
      Genel çevresel ifadeler açıklamasız ya da belirsizlik yaratacak şekilde kullanılamaz; beyanın ürünün hangi
      bölümü veya yaşam döngüsünün hangi süreci için olduğu açıkça yazılmalı; ölçüm yöntemi reklamda ya da bağlantıyla
      erişilebilir olmalı; sertifikalar yetkili/akredite kuruluş belgesiyle ispatlanmalıdır.
    duzeltme: >
      "Çevre dostu" yerine somut ifade yazın: "Ambalaj %80 geri dönüştürülmüş kartondan (belge: ..., ayrıntı: link)".
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile değişik/eklenen)"
        madde: "17(3), 17(5), 17(6), 4(1)(r)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"

