  - id: DGR-02
    baslik: "Ödül ve akademik unvan"
    kategori: diger
    siddet: UYARI
    kosul: >
      Önceden ilan edilmiş objektif kriterlere dayanmayan ve menfaat karşılığı verilen ödüller reklamda kullanılamaz;
      ödüller ve akademik unvanlar konusunda tüketici yanıltılamaz.
    duzeltme: "Ödülün adı, veren kurum ve yılını yazın; para karşılığı alınan \"yılın markası\" türü ödülleri kullanmayın. Unvanı doğru yazın."
