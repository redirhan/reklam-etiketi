    baslik: "Tüketici yorumu / puan kullanımı"
    kategori: diger
    siddet: UYARI
    kosul: "Satın alma doğrulaması yapılmamış tüketici değerlendirmeleri reklamlarda kullanılamaz; yorumlar genel niteliği yansıtmalıdır."
    duzeltme: "Yalnız doğrulanmış alıcı yorumlarını kullanın; tek bir iyi yorumu genel kanaat gibi göstermeyin."
