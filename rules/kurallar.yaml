    baslik: "Çekiliş / yarışma"
    kategori: diger
    siddet: UYARI
    kosul: >
      Reklam verenin ürünü için çekiliş veya yarışma içeriği reklamdır (etiket gerekir). Promosyon süresinin başlangıç
      ve bitiş tarihi ile teslim koşulları açıklanmalıdır.
    duzeltme: "\"Reklam | @markahesabı\" etiketini ekleyin; çekiliş başlangıç-bitiş tarihini, katılım ve teslim koşullarını yazın. Çekilişler için ayrı izin mevzuatı olabilir; bu araç onu kontrol etmez."
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "23/A(2)(c)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
      - belge: "Yönetmelik"
        madde: "15(1)(c)"
        url: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
        okunma: "2026-10-27"

  - id: DGR-04
    baslik: "Yaptırım bilgisi (her raporda)"
    kategori: diger
    siddet: BILGI
    kosul: >
      Aykırılıkta Reklam Kurulu durdurma, aynı yöntemle düzeltme, idari para cezası, 3 aya kadar tedbiren durdurma ve
      internette içeriğin çıkarılması / erişim engeli kararı verebilir. Reklam veren, ajans ve mecra ayrı ayrı sorumludur;
      sonradan düzeltmek sorumluluğu kaldırmaz.
    duzeltme: "Bilgi amaçlıdır. Ceza tutarları kanunda yazılıdır ve her yıl güncellenir; tutar için resmî kaynağa bakın."
    kaynak:
