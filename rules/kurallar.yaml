# Reklam Etiketi Kontrolü: kural dosyası
# Bu bir hukuki görüş değildir; bilgilendirme amaçlıdır.
#
# Her kural: id, baslik, kategori, siddet, kosul (ne zaman devreye girer), duzeltme (ne yapılmalı),
# kaynak (belge + madde + URL + okunma tarihi), gerekirse belirsizlik.
# siddet: DUZELT (kurala aykırı görünüyor) | UYARI (risk ya da daha sıkı yorum) |
#         UZMANA_SOR (hukuki değerlendirme gerekir) | MANUEL (gözle bakılmalı) | BILGI
# Kontrol mantığı scripts/kontrol.py içinde kural id'si ile eşleşir. Anahtar kelime listeleri
# en alttaki "sozluk" bölümündedir; genişletebilirsiniz (sonuna $ = tam kelime, r: = düzenli ifade).
#
# Kaynaklar çelişirse DAHA SIKI kural kodlandı ve "belirsizlik" alanında belirtildi.

surum: "1.0.0"
kural_tarihi: "2026-10-27"
uyari_metni: "Bu bir hukuki görüş değildir; bilgilendirme amaçlıdır."
yururluk_2026: "2026-08-01"

