        okunma: "2026-10-27"

  - id: KRS-02
    baslik: "Karşılaştırma iddiası belgeli ve objektif mi?"
    kategori: karsilastirma
    siddet: UZMANA_SOR
    kosul: >
      Karşılaştırma aynı ihtiyacı karşılayan ürünler arasında, maddi ve doğrulanabilir özellikler üzerinden, objektif
      olmalı; iddialar üniversitelerin ilgili bölümlerinden ya da akredite/bağımsız kuruluşlardan alınmış belgelerle
      kanıtlanmalı; rakip kötülenmemelidir.
    duzeltme: "Karşılaştırmanın dayandığı test raporunu reklam verenden isteyin; yoksa karşılaştırmayı çıkarın."
