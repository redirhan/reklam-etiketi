# Yayın türleri
bicimler:
  video: [reels, video, shorts, story, canli, tiktok]
  gorsel: [gonderi, carousel]
  sesli: [podcast, sesli]
  kisa_sureli: [story]
  uzun_video: [video, canli]

# Açıklamanın "daha fazla" kısaltmasından önce görünen yaklaşık karakter sayısı.
# [tahmin] Platformlar bunu değiştirir; kontrol ayrıca "ilk satır" şartı arar (daha sıkı).
gorunur_karakter:
  instagram: 125
  tiktok: 100
  youtube: 100
  diger: 100

kurallar:
  # ---------------- ETİKET ----------------
  - id: ETK-01
    baslik: "Ticari ilişki var mı?"
    kategori: etiket
    siddet: UZMANA_SOR
    kosul: >
      Paylaşımda reklam verene ait mal veya hizmete yönlendirme (indirim kodu, bağlantı, satış ortaklığı), reklam verenden
      para ya da ücretsiz veya indirimli ürün veya hizmet, reklam verenin ürünü için çekiliş, yarışma ya da kampanya veya
      menfaat karşılığı etkinlik katılımı varsa içerik reklamdır. Girdi "ticari_iliski: bilinmiyor" ise ya da "hayir"
      denmesine rağmen metinde bu sinyaller varsa kontrol durur ve sorar.
    duzeltme: >
      Ticari ilişkiyi netleştirin. Yukarıdakilerden biri varsa "ticari_iliski: evet" yapın ve etiket kurallarını uygulayın.
      Yönlendirme ya da hediye ürün de, para alınmasa bile, reklam sayılır.
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "23/A(2)(a)-(ç)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "4(1)(ş) sosyal medya etkileyicisi tanımı"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
      - belge: "Kılavuz"
        madde: "5(2)"
        url: https://iabtr.org/wp-content/uploads/2024/06/Sosyal-Medya-Etkileyicileri-Tarafindan-Yapilan-Ticari-Reklam-ve-Haksiz-Ticari-Uygulamalar-Hakkinda-Kilavuz1062021101250.pdf
        okunma: "2026-10-27"

  - id: ETK-02
    baslik: "\"Reklam\" ya da \"Tanıtım\" ifadesi var mı?"
    kategori: etiket
    siddet: DUZELT
    kosul: >
      Ticari ilişki varsa açıklamada (YouTube'da başlık ya da açıklamada) "Reklam" veya "Tanıtım" ifadelerinden biri
      olmalıdır. Yalnız "#işbirliği", "#sponsor", "#ortaklık", "ücretli ortaklık" gibi ifadeler bu şartı karşılamaz.
    duzeltme: >
      Açıklamanın en başına "Reklam" (ya da "Tanıtım") yazın. "#işbirliği" gibi etiketleri isterseniz ondan SONRA
      ekleyebilirsiniz.
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "23/A(3)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
      - belge: "Kılavuz (eski liste, çelişki notu için)"
        madde: "8(1), 10(1)"
        url: https://iabtr.org/wp-content/uploads/2024/06/Sosyal-Medya-Etkileyicileri-Tarafindan-Yapilan-Ticari-Reklam-ve-Haksiz-Ticari-Uygulamalar-Hakkinda-Kilavuz1062021101250.pdf
        okunma: "2026-10-27"
    belirsizlik: >
      2021 Kılavuzu "#Sponsor", "#İşbirliği", "#Ortaklık", "@marka ile işbirliği" ifadelerini de sayıyordu. Bazı haberler
      01.08.2026 sonrası "iş birliği" ve "sponsorlu içerik" ifadelerinin de yeterli olduğunu yazıyor. Resmî Gazete'deki
      23/A(3) metni ise yalnız "Reklam" ya da "Tanıtım" için "zorunludur" diyor. Daha sıkı olan Yönetmelik metni kodlandı.

  - id: ETK-03
    baslik: "Reklam verenin adı ya da @hesabı etiketle birlikte mi?"
    kategori: etiket
    siddet: DUZELT
    kosul: >
      "Reklam/Tanıtım" ifadesiyle birlikte reklam verenin adı ya da ticaret unvanı, veya "@[reklam veren] tarafından
      sağlandı.", "Ürünleri bana gönderdiği için @[reklam verene] teşekkürler.", "@[reklam verene] teşekkürler."
      açıklamalarından biri içerikte yer almalıdır.
    duzeltme: >
      Etiket satırını "Reklam | @markahesabı" ya da "Reklam: @markahesabı tarafından sağlandı." biçiminde yazın.
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "23/A(3)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
    belirsizlik: >
      Metin adın "içerikte" yer almasını istiyor; etiketle aynı satırda olma şartı açıkça yazmıyor. Kontrol daha sıkı
      davranır: ad etiketle aynı satırda değilse UYARI verir.

  - id: ETK-04
    baslik: "Etiket ilk bakışta görünüyor mu (ilk satır, diğer etiketlerden önce)?"
    kategori: etiket
    siddet: DUZELT
    kosul: >
      Etiket, kullanıcı paylaşımla ilk karşılaştığında, ekranı kaydırmadan ya da "devamını gör" gibi başka bir alana
      gitmeden görülmelidir. Başka etiket (#) veya açıklamalardan (@) ÖNCE gelmelidir. Kontrol: etiket açıklamanın ilk
      satırında ve platformun görünen karakter sınırı içinde mi; önünde # veya @ var mı.
    duzeltme: >
      Etiket satırını açıklamanın ilk satırına, her şeyden önce koyun. Yorumlara, son satırlara ya da hashtag
      yığınının içine koymayın.
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "23/A(4)(b), 23/A(4)(c)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
      - belge: "Kılavuz"
        madde: "5(3)(b), 7(1) (\"daha fazla oku\" alanına tıklatmadan)"
        url: https://iabtr.org/wp-content/uploads/2024/06/Sosyal-Medya-Etkileyicileri-Tarafindan-Yapilan-Ticari-Reklam-ve-Haksiz-Ticari-Uygulamalar-Hakkinda-Kilavuz1062021101250.pdf
        okunma: "2026-10-27"
    belirsizlik: >
      Görünen karakter sınırı platforma ve cihaza göre değişir (dosyadaki sayılar tahmindir). Bu yüzden ilk satır şartı
      aranır.

  - id: ETK-05
    baslik: "Videoda/story'de ekranda etiket ilk kareden itibaren var mı?"
    kategori: etiket
    siddet: DUZELT
    kosul: >
      Video, reels, shorts, TikTok ve story'de etiket ekranda yazılı olarak ilk kareden itibaren görünmelidir.
      Story gibi kısa süreli içerikte paylaşım SÜRESİNCE kalmalıdır. Diğer videolarda tüm süre boyunca kalması önerilir.
    duzeltme: >
      Ekrana "REKLAM · @markahesabı" yazısını 0. saniyeden sona kadar, üst-orta bölgede, düz renkli bir kutu
      üstünde koyun.
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "23/A(4)(b)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
      - belge: "Kılavuz"
        madde: "10(1) (kısa süreli içerik: \"paylaşım süresince\"), 7(1) (video: \"video içinde sürekli\" seçeneği)"
        url: https://iabtr.org/wp-content/uploads/2024/06/Sosyal-Medya-Etkileyicileri-Tarafindan-Yapilan-Ticari-Reklam-ve-Haksiz-Ticari-Uygulamalar-Hakkinda-Kilavuz1062021101250.pdf
        okunma: "2026-10-27"
    belirsizlik: >
      Yönetmelik videoda etiketin ne kadar süre kalacağını yazmıyor, sadece "ilk karşılaştıkları anda" diyor. Reels'te
      açıklamanın ilk satırının yeterli sayılıp sayılmayacağı net değil. Daha sıkı yorum kodlandı: ekranda ilk kareden
      itibaren (story'de tüm süre) zorunlu, diğer videolarda tüm süre önerilir.

  - id: ETK-06
    baslik: "Etiket okunaklı mı (kontrast, boyut)?"
    kategori: etiket
    siddet: MANUEL
    kosul: >
      Etiket paylaşımdaki renklerden ve arka fondan ayırt edilebilir ve kolay okunur büyüklükte olmalıdır.
    duzeltme: >
      Beyaz yazı + koyu düz kutu (ya da tersi) kullanın. Telefonda kolun uzunluğunda okunabilecek boyut seçin;
      hareketli zeminde opak kutu kullanın.
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "23/A(4)(a)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
      - belge: "Yönetmelik"
        madde: "21(1)(a)-(b) (alt yazı kontrastı ve opak blok; benzetme yoluyla)"
        url: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
        okunma: "2026-10-27"

  - id: ETK-07
    baslik: "Etiket platform arayüzüyle çakışıyor mu?"
    kategori: etiket
    siddet: UYARI
    kosul: >
      Etiket, mecranın arayüzündeki yazı ya da simgelerle (kullanıcı adı, açıklama, beğen/yorum düğmeleri, ilerleme
      çubuğu) örtüşmemelidir. Ekran yazısının konumu "alt", "sag_alt", "sol_alt" ya da "sag" ise uyarı verilir.
    duzeltme: >
      Etiketi üst-orta bölgeye (dikey videoda yaklaşık üstten %15-25 arası) taşıyın; sağdaki düğme sütunundan ve alttaki
      açıklama alanından uzak tutun.
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "23/A(4)(ç)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"

  - id: ETK-08
    baslik: "Videoda sözlü beyan var mı?"
    kategori: etiket
    siddet: DUZELT
    kosul: >
      YouTube gibi video paylaşım mecralarındaki videolar ve canlı yayınlarda reklam olduğu yazılı VE sözlü olarak
      belirtilir. Reels/TikTok/shorts'ta sesli anlatım varsa sözlü beyan önerilir (UYARI).
    duzeltme: >
      Videonun başında (ya da reklam bölümünün başında) "Bu video [reklam veren] reklamı içerir." deyin.
    ornek_metin: "Bu video {reklam_veren} reklamı içerir."
    kaynak:
      - belge: "Kılavuz"
        madde: "7(1)"
        url: https://iabtr.org/wp-content/uploads/2024/06/Sosyal-Medya-Etkileyicileri-Tarafindan-Yapilan-Ticari-Reklam-ve-Haksiz-Ticari-Uygulamalar-Hakkinda-Kilavuz1062021101250.pdf
        okunma: "2026-10-27"
    belirsizlik: >
      Sözlü beyan şartı Kılavuz'dan geliyor; 2026 Yönetmeliği videoda sözlü beyanı açıkça istemiyor (yalnızca sesli
      paylaşımlar için 23/A(5)). Kılavuz'daki örnek cümleler "Reklam/Tanıtım" kelimesi içermeyebilir; kontrol
      "reklam" kelimesini içeren cümleyi önerir.

  - id: ETK-09
    baslik: "Yalnızca sesli paylaşım / podcast: başta sözlü beyan"
    kategori: etiket
    siddet: DUZELT
    kosul: >
      Yalnızca sesli paylaşımlarda yayının başında ve reklamın öncesinde "[reklam veren] hakkında reklam/tanıtım
      içerir." ifadesi yer almalıdır. Kılavuz podcast için başta, ortada ve sonda beyan istiyordu.
    duzeltme: >
      Kaydın ilk cümlesi ve reklam bölümünden hemen önceki cümle "{reklam_veren} hakkında reklam içerir." olsun.
      Ortada ve sonda da tekrarlayın.
    ornek_metin: "{reklam_veren} hakkında reklam içerir."
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "23/A(5)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
      - belge: "Kılavuz"
        madde: "9(1)"
        url: https://iabtr.org/wp-content/uploads/2024/06/Sosyal-Medya-Etkileyicileri-Tarafindan-Yapilan-Ticari-Reklam-ve-Haksiz-Ticari-Uygulamalar-Hakkinda-Kilavuz1062021101250.pdf
        okunma: "2026-10-27"

  - id: ETK-10
    baslik: "Birden fazla parçaya yayılan içerikte her parçada etiket"
    kategori: etiket
    siddet: DUZELT
    kosul: >
      İçerik birden fazla paylaşıma yayılıyorsa (ör. art arda story'ler) etiket her birinde olmalıdır. Carousel'de ilk
      karede de etiket önerilir.
    duzeltme: >
      Her story karesine / her parçaya aynı "REKLAM · @markahesabı" yazısını koyun.
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "23/A(4)(d)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"

  - id: ETK-11
    baslik: "Farklı biçim / başka platforma aktarılan paylaşımda etiket"
    kategori: etiket
    siddet: UYARI
    kosul: >
      Aynı reklam içeriği farklı paylaşım biçimlerinde (reels + story + TikTok) yer alıyorsa ya da birinden diğerine
      alıntılanıyorsa (story'de reels paylaşmak) etiket her birinde olmalıdır.
    duzeltme: >
      Her platform ve biçim için etiketi ayrıca ekleyin; story'de paylaştığınız reels'in üstüne de etiket koyun.
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "23/A(4)(e)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"

  - id: ETK-12
    baslik: "Markanın kendi hesabı"
    kategori: etiket
    siddet: UYARI
    kosul: >
      Paylaşım markanın kendi hesabından yapılıyor ve dışarıdan bir içerik üreticisi yoksa: 23/A'nın etkileyici tanımı
      tüzel kişileri ve "kendisi adına" paylaşımı da kapsıyor, ama markanın kendi hesabında etiketin zorunlu olup olmadığı
      metinde net değil. Her durumda reklamın reklam olduğu açıkça anlaşılmalıdır.
    duzeltme: >
      İçerik açıkça markanın kendi tanıtımı değilse (ör. röportaj, haber, "gerçek kullanıcı" görünümlü video) "Reklam"
      etiketi ekleyin. Emin değilseniz eklemek düşük maliyetlidir.
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "4(1)(ş)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
      - belge: "Yönetmelik"
        madde: "6(1), 6(3)"
        url: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
        okunma: "2026-10-27"
    belirsizlik: "Markanın kendi hesabı için 23/A'nın uygulanıp uygulanmayacağı yorum meselesi."

  - id: ETK-13
    baslik: "Platformun \"ücretli ortaklık\" aracı tek başına yeterli mi?"
    kategori: etiket
    siddet: UYARI
    kosul: >
      Instagram/TikTok/YouTube'un yerleşik "ücretli ortaklık / paid partnership" etiketi kullanılıyorsa: bu etiket
      "Reklam" ya da "Tanıtım" kelimesini içermediği için 23/A(3)'ü tek başına karşılamayabilir.
    duzeltme: "Platform aracını kullanmaya devam edin, ama metne ve ekrana \"Reklam\" etiketini de ekleyin."
    kaynak:
      - belge: "Yönetmelik (RG 33297 ile eklenen)"
        madde: "23/A(3)"
        url: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
        okunma: "2026-10-27"
    belirsizlik: "Reklam Kurulu'nun platform araçlarını nasıl değerlendirdiğine dair 2026 sonrası resmî açıklama bulunamadı."

  # ---------------- ETKİLEYİCİ YÜKÜMLÜLÜKLERİ ----------------
  - id: ETY-01
    baslik: "Hediye ürün satın alınmış gibi gösterilmiş mi?"
    kategori: etkileyici
    siddet: DUZELT
    kosul: "Ürün reklam verenden hediye geldiyse, metinde \"satın aldım\", \"kendi paramla\" gibi ifadeler olmamalı."
    duzeltme: "\"Satın aldım\" yerine \"@markahesabı gönderdi\" ya da \"@markahesabı tarafından sağlandı\" yazın."
    kaynak:
      - belge: "Kılavuz"
        madde: "6(1)(d)"
        url: https://iabtr.org/wp-content/uploads/2024/06/Sosyal-Medya-Etkileyicileri-Tarafindan-Yapilan-Ticari-Reklam-ve-Haksiz-Ticari-Uygulamalar-Hakkinda-Kilavuz1062021101250.pdf
        okunma: "2026-10-27"

  - id: ETY-02
    baslik: "Deneyimlenmemiş ürün öneriliyor mu?"
    kategori: etkileyici
    siddet: DUZELT
    kosul: "Ürünü henüz kullanmadıysanız onu onaylayan ya da deneyimlediğiniz algısını yaratan reklam paylaşamazsınız."
    duzeltme: "Ürünü önce kullanın ya da metni \"ilk izlenim / kutu açılışı\" olarak dürüstçe yazın; \"yıllardır kullanıyorum\" gibi iddialardan kaçının."
    kaynak:
      - belge: "Kılavuz"
        madde: "6(1)(a)"
        url: https://iabtr.org/wp-content/uploads/2024/06/Sosyal-Medya-Etkileyicileri-Tarafindan-Yapilan-Ticari-Reklam-ve-Haksiz-Ticari-Uygulamalar-Hakkinda-Kilavuz1062021101250.pdf
        okunma: "2026-10-27"
      - belge: "Yönetmelik"
        madde: "16(1) (tanıklı reklamlar)"
        url: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
        okunma: "2026-10-27"

  - id: ETY-03
    baslik: "Filtre/efekt kullanıldıysa belirtilmiş mi?"
    kategori: etkileyici
    siddet: DUZELT
    kosul: "Bir malın reklamında görüntüye efekt veya filtre uygulandıysa bu açıkça belirtilmelidir."
    duzeltme: "Ekrana ve açıklamaya \"Bu görüntüde filtre kullanılmıştır.\" yazın."
    ornek_metin: "Bu görüntüde filtre kullanılmıştır."
    kaynak:
      - belge: "Kılavuz"
        madde: "6(1)(f)"
        url: https://iabtr.org/wp-content/uploads/2024/06/Sosyal-Medya-Etkileyicileri-Tarafindan-Yapilan-Ticari-Reklam-ve-Haksiz-Ticari-Uygulamalar-Hakkinda-Kilavuz1062021101250.pdf
        okunma: "2026-10-27"

  - id: ETY-04
    baslik: "\"Sadece bir tüketiciyim\" izlenimi"
    kategori: etkileyici
    siddet: DUZELT
    kosul: >
      Reklam verenden fayda sağlanırken "reklam değil", "kimse para vermedi", "tamamen kendi fikrim" gibi ifadelerle
      sadece bir tüketici olduğunuz izlenimi verilemez.
    duzeltme: "Bu ifadeleri çıkarın; ilişkiyi \"Reklam | @markahesabı\" ile açıkça belirtin."
    kaynak:
      - belge: "Kılavuz"
        madde: "6(1)(e)"
