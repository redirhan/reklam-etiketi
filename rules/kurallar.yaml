        okunma: "2026-10-27"

  - id: KRS-03
    baslik: "Üstünlük iddiası (\"en iyi\", \"1 numara\", \"Türkiye'nin en ...\")"
    kategori: karsilastirma
    siddet: UYARI
    kosul: "Reklamdaki iddiaların doğruluğunu ispat yükü reklam verendedir; doğrulanabilir iddialar bilimsel geçerliliği olan belgelerle kanıtlanmalıdır."
    duzeltme: "Belgesi yoksa üstünlük iddiasını kişisel ve ölçülü bir ifadeyle değiştirin (\"benim favorim\")."
    kaynak:
